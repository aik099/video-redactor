name: Tests and publish

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Node tests (snapping, ffmpeg command and output, region files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Static build (seconds; apt's ffmpeg takes ~50 s for 89 packages). BtbN keeps only the 2 newest
      # release lines: when n8.1 disappears from https://github.com/BtbN/FFmpeg-Builds/releases, bump it
      - name: Install ffmpeg
        run: |
          mkdir -p "$HOME/ffmpeg"
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            | tar -xJ -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/ffmpeg" -hide_banner -version | head -1
      - run: npm test

  smoke:
    name: Browser smoke test (Google Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The runner's preinstalled Google Chrome plays the H.264 fixture; Playwright's own Chromium can't
      - name: Install Playwright (without its browsers)
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run smoke

  # Needs Settings → Pages → Source: GitHub Actions. The live site only changes when both test jobs pass
  publish:
    name: Publish to GitHub Pages
    needs: [unit, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the app's files (allow-list: a new app file must be added here); tests, docs etc. stay in the repo
      - name: Collect the app's files
        run: |
          mkdir _site
          cp -r index.html redact.css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
