name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Node tests (snapping, ffmpeg command and output, region files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test

  smoke:
    name: Browser smoke test (Google Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The runner's preinstalled Google Chrome plays the H.264 fixture; Playwright's own Chromium can't
      - name: Install Playwright (without its browsers)
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run smoke
